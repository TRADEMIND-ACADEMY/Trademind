<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>TradeMind Academy — Hors ligne</title>
<style>:root{color-scheme:dark light}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;font:16px/1.5 system-ui,sans-serif;background:#0a0910;color:#f4f0f6}main{max-width:420px;text-align:center}h1{font-size:clamp(20px,5vw,26px);margin:12px 0 8px}p{color:#b6aebf;margin:0 0 18px}button{min-height:46px;padding:0 22px;border-radius:12px;border:0;background:#7047b8;color:#fff;font:inherit;font-weight:700;cursor:pointer}img{width:72px;height:72px;border-radius:16px}</style></head>
<body><main><img src="/icons/icon-192.png" alt="TradeMind Academy"><h1 id="t">Vous êtes hors ligne</h1><p id="p">Connexion Internet indisponible. La connexion à votre compte et les paiements nécessitent le réseau. Reconnectez-vous puis réessayez.</p><button id="b" type="button">Réessayer</button></main>
