
name: Extraire un ZIP du dépôt

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "Nom exact du ZIP à la racine du dépôt"
        required: true
        default: "TRADEMIND-ACADEMY-WEB-UNIFIED.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier et extraire le ZIP
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          set -euo pipefail

          # Vérifier le nom
          case "$ZIP_NAME" in
            */*|*..*|"")
              echo "::error::Nom de fichier invalide"
              exit 1
              ;;
          esac

          # Vérifier l'existence
          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::ZIP introuvable à la racine"
            ls -lah
            exit 1
          fi

          # Informations du fichier
          echo "=== Fichier sélectionné ==="
          ls -lh "$ZIP_NAME"
          file "$ZIP_NAME"

          # Vérifier l'intégrité
          echo "=== Test de l'archive ==="
          if ! unzip -tq "$ZIP_NAME"; then
            echo "::error::ZIP invalide ou endommagé. Aucun fichier ne sera extrait."
            exit 1
          fi

          # Préparer extraction
          rm -rf /tmp/unz
          mkdir -p /tmp/unz

          unzip -q "$ZIP_NAME" \
            -x ".git/*" "node_modules/*" \
            -d /tmp/unz

          # Protéger les dossiers Git et dépendances
          find /tmp/unz -type d \( -name ".git" -o -name "node_modules" \) -prune -exec rm -rf {} +

          # Détecter un dossier racine unique
          n=$(find /tmp/unz -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$n" -eq 1 ] && [ -d "$(find /tmp/unz -mindepth 1 -maxdepth 1)" ]; then
            src="$(find /tmp/unz -mindepth 1 -maxdepth 1)"
          else
            src=/tmp/unz
          fi

          # Préserver les configurations GitHub existantes
          if [ -d "$src/.github" ]; then
            echo "::warning::Le dossier .github du ZIP est ignoré."
            rm -rf "$src/.github"
          fi

          # Copier les fichiers
          cp -a "$src"/. .

          # Supprimer le ZIP après extraction réussie
          rm -f "$ZIP_NAME"

          echo "=== Extraction terminée ==="
          ls -lah

      - name: Enregistrer les modifications
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi

          git commit -m "Extraction du ZIP ${{ inputs.zip_name }}"

          git push
          
