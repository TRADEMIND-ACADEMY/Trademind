<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--fh:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;--fb:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
--bg:#08090d;--surf:#0e1017;--surf2:#14161f;--bd:rgba(255,255,255,.07);--line:rgba(255,255,255,.05);
--tx:#f3f2f7;--txm:#7d8194;--pri:#4a4560;--acc:#9b87f5;--ok:#3ddc94;--bad:#f2665e;--warn:#e8b64f;--glow:rgba(155,135,245,.12)}
[data-theme="day"]{--bg:#faf9f7;--surf:#ffffff;--surf2:#f4f3f0;--bd:rgba(15,20,30,.08);--line:rgba(15,20,30,.05);
--tx:#14161c;--txm:#6b6f7d;--pri:#5c5470;--acc:#7c5cd6;--ok:#0d9464;--bad:#c8433a;--warn:#a9791f;--glow:rgba(124,92,214,.07)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--fb);background:
radial-gradient(ellipse 900px 500px at 15% -5%,var(--glow),transparent 60%),
radial-gradient(ellipse 700px 500px at 100% 20%,rgba(155,135,245,.06),transparent 55%),
var(--bg);color:var(--tx);overflow-x:hidden;transition:background-color .4s,color .4s;cursor:default;
background-attachment:fixed}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
::selection{background:var(--acc);color:#fff}
.num{font-variant-numeric:tabular-nums}
#splash{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;animation:splashOut .5s ease 900ms forwards}
#splash .mono{width:52px;height:52px;border:1px solid var(--bd);border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:700;font-size:18px;color:var(--acc);animation:pop .6s ease}
#splash .sname{font-family:var(--fh);font-weight:600;letter-spacing:2px;font-size:13px;margin-top:8px}
#splash .stag{font-size:9px;letter-spacing:2px;color:var(--txm);text-transform:uppercase}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes splashOut{to{opacity:0;visibility:hidden;pointer-events:none}}
#cursor{position:fixed;width:16px;height:16px;border:1px solid var(--acc);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .18s,height .18s,opacity .18s,border-color .18s;opacity:0}
#cursor.on{opacity:.7}

.app{display:flex;min-height:100vh}
.sidebar{display:none}
.topbar{position:sticky;top:0;z-index:20;margin:calc(10px + env(safe-area-inset-top,0px)) 14px 6px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:color-mix(in srgb,var(--surf) 78%,transparent);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:16px}
.brand{display:flex;align-items:center;gap:9px}

.iconbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
.iconbtn svg{width:15px;height:15px}
.status{font-size:9px;letter-spacing:1px;color:var(--txm);text-transform:uppercase;display:flex;align-items:center;gap:5px}
.status i{width:5px;height:5px;border-radius:50%;background:var(--ok);display:inline-block}
.content{flex:1;padding:6px 14px 100px;max-width:1120px;margin:0 auto;width:100%}
.view{display:none}

.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.banner{background:color-mix(in srgb,var(--acc) 10%,transparent);border:1px solid color-mix(in srgb,var(--acc) 35%,var(--bd));color:var(--acc);border-radius:11px;padding:11px 14px;font-size:11.5px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;letter-spacing:.2px}

@media(min-width:900px){
.sidebar{display:flex;flex-direction:column;width:230px;background:var(--surf);border-right:1px solid var(--bd);padding:22px 16px;position:sticky;top:0;height:100vh}

}

html{scroll-behavior:smooth}body{background:var(--bg);isolation:isolate}.app{position:relative;z-index:1}.content{position:relative;z-index:2}
body::after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse 70% 55% at 75% -10%,color-mix(in srgb,var(--acc) 10%,transparent),transparent 70%),radial-gradient(ellipse 65% 50% at 10% 100%,color-mix(in srgb,var(--acc) 6%,transparent),transparent 70%)}
.ambient-market{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.46;mix-blend-mode:normal}.ambient-market:before{content:"";position:absolute;inset:-20%;background:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:74px 74px;transform:perspective(900px) rotateX(58deg) translateY(22%);transform-origin:center bottom;mask-image:linear-gradient(to bottom,transparent 12%,#000 48%,transparent 100%)}
[data-theme="day"] .ambient-market{opacity:.16}.ambient-equity{position:absolute;right:-4vw;top:18vh;width:min(69vw,980px);height:260px;opacity:.24;filter:blur(.3px)}.ambient-equity path{fill:none;stroke:var(--acc);stroke-width:1.4;vector-effect:non-scaling-stroke}.ambient-equity .secondary{opacity:.38;stroke-width:1}
.ambient-candle{position:absolute;width:7px;border-radius:2px;background:linear-gradient(to bottom,color-mix(in srgb,var(--acc) 45%,transparent),color-mix(in srgb,var(--acc) 9%,transparent));box-shadow:0 0 20px var(--glow);opacity:.3}.ambient-candle:before,.ambient-candle:after{content:"";position:absolute;left:3px;width:1px;background:var(--acc);opacity:.7}.ambient-candle:before{height:24px;top:-24px}.ambient-candle:after{height:18px;bottom:-18px}.c1{right:24%;top:24%;height:46px}.c2{right:31%;top:31%;height:74px}.c3{right:39%;top:21%;height:32px}.c4{right:46%;top:39%;height:58px}.c5{right:54%;top:27%;height:42px}
.ambient-data{position:absolute;font:700 8px/1 var(--fh);letter-spacing:2px;color:var(--acc);opacity:.22}.d1{right:8%;top:15%}.d2{right:16%;bottom:24%}.d3{left:17%;bottom:16%}
.splash-grid{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:68px 68px;mask-image:radial-gradient(circle at center,#000,transparent 68%)}
#splash{background:radial-gradient(ellipse at center,color-mix(in srgb,var(--acc) 9%,var(--bg)),var(--bg) 55%);overflow:hidden;gap:8px}#splash:before{content:"";position:absolute;width:520px;height:520px;border:1px solid color-mix(in srgb,var(--acc) 28%,transparent);border-radius:50%;box-shadow:0 0 0 34px color-mix(in srgb,var(--acc) 3%,transparent),0 0 90px var(--glow);animation:tm-orbit 7s ease-in-out infinite alternate}#introCanvas{position:absolute;width:min(520px,100vw);height:240px;opacity:.22;filter:blur(.2px)}.splash-logo{position:relative;width:132px;height:132px;object-fit:contain;border-radius:28px;box-shadow:0 18px 65px rgba(0,0,0,.34);animation:tm-logo-in .9s var(--tm-ease) both}.sname{position:relative;font-size:15px!important;letter-spacing:3px!important;font-weight:700!important}.stag{position:relative;letter-spacing:3px!important;color:var(--acc)!important}.skipbtn{position:relative}
@keyframes tm-logo-in{from{opacity:0;transform:translateY(14px) scale(.94);filter:blur(7px)}to{opacity:1;transform:none;filter:none}}@keyframes tm-orbit{from{transform:scale(.92) rotate(-4deg);opacity:.45}to{transform:scale(1.05) rotate(4deg);opacity:.8}}
.brand-logo{width:42px;height:42px;object-fit:contain;border-radius:11px;box-shadow:0 7px 22px var(--glow);border:1px solid color-mix(in srgb,var(--acc) 32%,var(--bd));flex-shrink:0}.brand .mono{display:none}.brandtxt{letter-spacing:1.8px!important;font-weight:800!important}.brandtxt small{letter-spacing:1.55px!important}
.sidebar{background:color-mix(in srgb,var(--surf) 92%,transparent)!important;border-right-color:color-mix(in srgb,var(--acc) 14%,var(--bd))!important}.sidebar .brand{padding-bottom:22px}.sidebar nav{gap:3px}.sidebar .navlink{position:relative;min-height:44px}.sidebar .navlink.active:after{content:"";position:absolute;right:10px;width:4px;height:4px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--glow)}
.topbar .brand-logo{width:36px;height:36px}.topbar .brandtxt{font-size:10.5px!important}.topbar{box-shadow:0 14px 40px rgba(0,0,0,.08)!important}
.btn{border-radius:9px;min-height:40px}.btn.primary{background:linear-gradient(135deg,var(--tx),color-mix(in srgb,var(--tx) 76%,var(--acc)));box-shadow:0 10px 26px color-mix(in srgb,var(--tx) 12%,transparent)}.btn.primary:hover{background:linear-gradient(135deg,var(--acc),var(--tm-violet-deep));transform:translateY(-2px)}.btn:not(.primary):not(.danger){background:transparent;border-color:color-mix(in srgb,var(--acc) 26%,var(--bd));color:var(--txm)}.btn:not(.primary):not(.danger):hover{background:var(--glow);color:var(--tx)}.btn.danger{background:transparent}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.card,.chartcard,.statrow,.grid,.coachlist,.pro-toolbar,.pro-kpi,.pro-chart-card,.confluence-panel{border-color:color-mix(in srgb,var(--acc) 12%,var(--bd));box-shadow:0 18px 55px rgba(0,0,0,.055)}.hero{padding-top:22px}.hero:before{content:"ACCOUNT INTELLIGENCE";position:absolute;left:4px;top:0;font:700 8px var(--fh);letter-spacing:2.5px;color:var(--acc);opacity:.8}.hero:after{opacity:.55}
.sechead h2{letter-spacing:2.1px}.stat{transition:background .22s var(--tm-ease),transform .22s var(--tm-ease)}.stat:hover{background:color-mix(in srgb,var(--acc) 5%,var(--surf));transform:translateY(-2px)}.chartcard{position:relative;overflow:hidden}.chartcard:before,.pro-chart-card:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,color-mix(in srgb,var(--acc) 4%,transparent),transparent 36%)}
#view-dashboard,#view-evolution,#view-journal,#view-newtrade,#view-analytics,#view-settings{animation-duration:.42s}.view.active{will-change:opacity,transform}.navlink,.bottomnav button,.tabs button,.iconbtn{transition:color .2s var(--tm-ease),background .2s var(--tm-ease),border-color .2s var(--tm-ease),transform .2s var(--tm-ease)}
@media(max-width:899px){.ambient-market{opacity:.26}.ambient-equity{right:-30vw;top:24vh;width:125vw}.ambient-data{display:none}.splash-logo{width:118px;height:118px}.brand-logo{width:34px;height:34px}.brandtxt{font-size:10px!important}.content{padding-top:20px}.hero{padding-top:20px}.bottomnav{background:color-mix(in srgb,var(--surf) 91%,transparent)!important;border-color:color-mix(in srgb,var(--acc) 16%,var(--bd))!important}.bottomnav button.active{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 18%,transparent),0 5px 18px var(--glow)}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.ambient-market,.splash-logo,#splash:before{animation:none!important}.view.active{animation:none!important}}
</style>
</head>
