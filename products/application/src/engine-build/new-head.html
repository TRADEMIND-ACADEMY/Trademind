<!DOCTYPE html>
<html lang="fr" data-theme="night">
<head>
<script>(function(){try{var s=JSON.parse(localStorage.getItem('dtj_settings')||'{}');var t=s.theme||'auto';if(t==='auto'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'night':'day';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','night');}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>TRADEMIND ACADEMY — Trader Intelligence System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TRADEMIND ACADEMY — "ORBITAL LEDGER" EXPERIENCE SYSTEM
   Presentation layer only. Trading logic + data integrity
   are owned by the preserved engine (see core scripts below).
   ============================================================ */
:root{
  --fh:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
  --fd:'Chakra Petch','Space Grotesk',sans-serif;
  --fm:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  --fb:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;

  --bg:#05060a;--surf:rgba(15,18,27,.72);--surf2:rgba(22,26,38,.72);--bd:rgba(255,255,255,.09);--line:rgba(255,255,255,.055);
  --tx:#eef1f8;--txm:#7f889e;--pri:#4a4560;
  --acc:#4fe3d0;--acc2:#a76cf5;--ok:#37e0a4;--bad:#ff6b73;--warn:#f2c14e;
  --glow:rgba(79,227,208,.14);--glow2:rgba(167,108,245,.14);
  --edge:color-mix(in srgb,var(--acc) 42%,transparent);
  --radius-lg:18px;--radius-xl:26px;
  --shadow-soft:0 18px 48px rgba(0,0,0,.28);
  --shadow-deep:0 40px 90px rgba(0,0,0,.5);
  --ease:cubic-bezier(.22,.75,.18,1);

  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
[data-theme="day"]{
  --bg:#eef0f5;--surf:rgba(255,255,255,.82);--surf2:rgba(244,245,249,.86);--bd:rgba(12,16,26,.1);--line:rgba(12,16,26,.06);
  --tx:#0d1017;--txm:#646b7c;--pri:#5c5470;--acc:#0d9488;--acc2:#7b3fd6;--ok:#0d9464;--bad:#c8433a;--warn:#a9791f;
  --glow:rgba(13,148,136,.12);--glow2:rgba(123,63,214,.1);
  --edge:color-mix(in srgb,var(--acc) 38%,transparent);
  --shadow-soft:0 18px 46px rgba(20,26,40,.1);--shadow-deep:0 34px 80px rgba(20,26,40,.16);
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{
  font-family:var(--fb);color:var(--tx);overflow-x:hidden;cursor:default;
  background:var(--bg);
  transition:background-color .5s var(--ease),color .5s var(--ease);
}
::selection{background:var(--acc);color:#04110f}
.num{font-variant-numeric:tabular-nums}
svg{display:block}
.hidden{display:none!important}

/* ---- ATMOSPHERE : layered spatial field ------------------- */
.tm-atmo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.tm-atmo::before{
  content:'';position:absolute;inset:-25%;
  background:
    linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:62px 62px;
  transform:perspective(760px) rotateX(62deg) translateY(26%);
  transform-origin:center bottom;
  mask-image:linear-gradient(to bottom,transparent 6%,#000 46%,transparent 100%);
  animation:tm-floor 42s linear infinite;
}
[data-theme="day"] .tm-atmo::before{
  background:linear-gradient(rgba(10,20,30,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(10,20,30,.05) 1px,transparent 1px);
  background-size:62px 62px;
}
.tm-atmo::after{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 62% 48% at 82% -8%,var(--glow2),transparent 62%),
    radial-gradient(ellipse 58% 46% at 6% 104%,var(--glow),transparent 64%);
}
.tm-orbit{position:absolute;border:1px solid color-mix(in srgb,var(--acc) 20%,transparent);border-radius:50%;opacity:.5}
.tm-orbit.o1{width:120vw;height:120vw;left:-40vw;top:-58vw;animation:tm-spin 96s linear infinite}
.tm-orbit.o2{width:86vw;height:86vw;right:-32vw;top:-30vw;border-color:color-mix(in srgb,var(--acc2) 20%,transparent);animation:tm-spin 128s linear infinite reverse}
.tm-orbit.o3{width:56vw;height:56vw;right:8vw;bottom:-30vw;opacity:.32;animation:tm-spin 74s linear infinite}
.tm-node{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--acc);box-shadow:0 0 14px 2px var(--glow);opacity:.5;animation:tm-blink 5s ease-in-out infinite}
.tm-node.n1{left:16%;top:22%;animation-delay:.4s}
.tm-node.n2{right:22%;top:38%;animation-delay:1.7s}
.tm-node.n3{right:38%;bottom:18%;animation-delay:2.9s}
.tm-ticker{position:absolute;left:0;right:0;white-space:nowrap;overflow:hidden;font:500 10px/1 var(--fm);letter-spacing:3px;color:color-mix(in srgb,var(--acc) 42%,transparent)}
.tm-ticker.top{top:12vh;opacity:.4}
.tm-ticker.bot{bottom:14vh;opacity:.3}
.tm-ticker span{display:inline-block;animation:tm-marquee 46s linear infinite}
.tm-ticker.bot span{animation-direction:reverse;animation-duration:58s}
@keyframes tm-floor{from{transform:perspective(760px) rotateX(62deg) translateY(26%) translateX(0)}to{transform:perspective(760px) rotateX(62deg) translateY(26%) translateX(62px)}}
@keyframes tm-spin{to{transform:rotate(360deg)}}
@keyframes tm-blink{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:.8;transform:scale(1.25)}}
@keyframes tm-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---- CURSOR FIELD --------------------------------------- */
#cursor{position:fixed;width:26px;height:26px;border:1px solid var(--acc);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .2s var(--ease),height .2s var(--ease),opacity .2s,border-color .2s;opacity:0;mix-blend-mode:screen}
#cursor::after{content:'';position:absolute;inset:50% auto auto 50%;width:3px;height:3px;border-radius:50%;background:var(--acc);transform:translate(-50%,-50%)}
#cursor.on{opacity:.7}
#cursor.big{width:48px;height:48px;background:var(--glow);opacity:.9}
@media(max-width:899px){#cursor{display:none}}

/* ---- SPLASH / IGNITION ---------------------------------- */
#splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--acc) 8%,var(--bg)),var(--bg) 58%);overflow:hidden;
  animation:tm-splash-out .55s var(--ease) 1100ms forwards}
#splash .splash-grid{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:66px 66px;mask-image:radial-gradient(circle at center,#000,transparent 66%)}
#splash::before{content:'';position:absolute;width:min(78vw,540px);height:min(78vw,540px);border:1px solid color-mix(in srgb,var(--acc) 26%,transparent);border-radius:50%;
  box-shadow:0 0 0 30px color-mix(in srgb,var(--acc) 3%,transparent),0 0 120px var(--glow);
  animation:tm-orbit-pulse 7s ease-in-out infinite alternate}
#introCanvas{position:relative;width:min(560px,100vw);height:230px;opacity:.3}
.splash-logo{position:relative;width:118px;height:118px;object-fit:contain;border-radius:26px;box-shadow:0 24px 70px rgba(0,0,0,.45);animation:tm-rise .9s var(--ease) both}
.sname{position:relative;font-family:var(--fd);font-weight:700;letter-spacing:6px;font-size:16px;margin-top:6px}
.stag{position:relative;font:600 9px/1 var(--fm);letter-spacing:3.4px;color:var(--acc);text-transform:uppercase}
.skipbtn{position:relative;margin-top:18px;background:none;border:1px solid var(--bd);color:var(--txm);font:600 9.5px/1 var(--fm);letter-spacing:2px;text-transform:uppercase;padding:9px 18px;border-radius:20px;cursor:pointer;transition:.2s}
.skipbtn:hover{border-color:var(--acc);color:var(--acc)}
@keyframes tm-splash-out{to{opacity:0;visibility:hidden;pointer-events:none}}
@keyframes tm-rise{from{opacity:0;transform:translateY(16px) scale(.94);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes tm-orbit-pulse{from{transform:scale(.94) rotate(-4deg);opacity:.4}to{transform:scale(1.04) rotate(4deg);opacity:.75}}

/* ---- APP SHELL ------------------------------------------ */
.app{position:relative;z-index:2;display:flex;min-height:100vh}
.sidebar{display:none}
.shell{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:60;margin:calc(12px + env(safe-area-inset-top,0px)) 14px 4px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;
  background:color-mix(in srgb,var(--surf) 82%,transparent);backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--shadow-soft)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:38px;height:38px;object-fit:contain;border-radius:11px;border:1px solid color-mix(in srgb,var(--acc) 30%,var(--bd));box-shadow:0 6px 20px var(--glow);flex-shrink:0}
.brandtxt{font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:1.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandtxt small{display:block;font:600 6.8px/1.5 var(--fm);letter-spacing:1.6px;color:var(--txm);margin-top:1px}
.topactions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.status{font:600 8.5px/1 var(--fm);letter-spacing:1.2px;color:var(--txm);text-transform:uppercase;display:none;align-items:center;gap:6px}
.status i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 16%,transparent);animation:tm-blink 3.4s ease-in-out infinite}
.iconbtn{background:transparent;border:1px solid var(--bd);color:var(--tx);width:34px;height:34px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s var(--ease)}
.iconbtn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);box-shadow:0 8px 18px var(--glow)}
.iconbtn svg{width:15px;height:15px}
.content{flex:1;padding:8px 14px calc(118px + env(safe-area-inset-bottom,0px));max-width:1240px;margin:0 auto;width:100%;min-width:0}

/* ---- VIEWS + ENTRANCE CHOREOGRAPHY ---------------------- */
.view{display:none}
.view.active{display:block}
.view.active .stagger>*{animation:tm-in .62s var(--ease) both;animation-delay:calc(var(--i,0)*72ms)}
@keyframes tm-in{from{opacity:0;transform:translateY(22px) scale(.99);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}

/* ---- SECTION / NARRATIVE HEADERS ------------------------ */
.eyebrow{font-family:var(--fd);font-size:9.5px;letter-spacing:3.2px;color:var(--acc);text-transform:uppercase;font-weight:600}
h1{font-family:var(--fh);font-size:clamp(24px,4.6vw,34px);font-weight:600;letter-spacing:-.8px;line-height:1.1;margin:8px 0 2px}
.sub{color:var(--txm);font-size:12.5px;line-height:1.55;margin-bottom:14px;max-width:64ch}
.sechead{display:flex;align-items:baseline;gap:10px;margin:34px 0 14px}
.sechead .idx{font-family:var(--fm);font-size:9px;color:var(--acc);letter-spacing:1.4px;opacity:.85}
.sechead h2{font-family:var(--fd);font-size:10px;font-weight:700;color:var(--tx);text-transform:uppercase;letter-spacing:2.2px;white-space:nowrap}
.sechead .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),color-mix(in srgb,var(--acc) 22%,transparent),transparent);min-width:16px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.banner{background:color-mix(in srgb,var(--acc) 10%,transparent);border:1px solid color-mix(in srgb,var(--acc) 32%,var(--bd));color:var(--acc);border-radius:12px;padding:11px 14px;font-size:11.5px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}

/* ---- BUTTONS / TABS / INPUTS ---------------------------- */
.btn{background:color-mix(in srgb,var(--surf2) 70%,transparent);color:var(--tx);border:1px solid var(--bd);border-radius:11px;min-height:42px;padding:11px 18px;font-family:var(--fb);font-weight:600;font-size:12.5px;cursor:pointer;transition:.22s var(--ease)}
.btn:hover{border-color:var(--edge);color:var(--acc);transform:translateY(-1px);box-shadow:0 10px 24px var(--glow)}
.btn.primary{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 52%,var(--acc2)));color:#04110f;border-color:transparent;box-shadow:0 12px 30px var(--glow);font-weight:700}
.btn.primary:hover{filter:brightness(1.08);color:#04110f}
.btn.danger{border-color:color-mix(in srgb,var(--bad) 46%,var(--bd));color:var(--bad);background:transparent}
.btn.danger:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:8px 13px;font-size:10.5px}
.tabs{display:flex;gap:3px;background:color-mix(in srgb,var(--surf2) 60%,transparent);border:1px solid var(--bd);border-radius:12px;padding:3px;width:fit-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:none;color:var(--txm);font-family:var(--fd);font-size:9.5px;font-weight:600;letter-spacing:.9px;padding:8px 12px;border-radius:8px;cursor:pointer;text-transform:uppercase;white-space:nowrap;transition:.2s var(--ease)}
.tabs button:hover{color:var(--tx)}
.tabs button.on{background:color-mix(in srgb,var(--acc) 16%,var(--surf));color:var(--acc);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 34%,transparent)}
.multitoggle{display:flex;gap:6px;flex-wrap:wrap}
.multitoggle button{background:color-mix(in srgb,var(--surf2) 65%,transparent);border:1px solid var(--bd);color:var(--txm);font-family:var(--fd);font-size:9.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:7px 13px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.2s var(--ease)}
.multitoggle button.on{color:var(--tx);border-color:var(--edge)}
.multitoggle .dotc{width:8px;height:8px;border-radius:50%;background:var(--txm);transition:.2s}
.multitoggle button[data-c="balance"] .dotc{background:var(--acc)}
.multitoggle button[data-c="equity"] .dotc{background:var(--ok)}
.multitoggle button[data-c="drawdown"] .dotc{background:var(--bad)}
input,select,textarea{background:color-mix(in srgb,var(--surf2) 78%,transparent);border:1px solid var(--bd);color:var(--tx);border-radius:11px;padding:11px 13px;font-size:13px;font-family:var(--fb);width:100%;min-height:44px;transition:.2s var(--ease)}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--acc) 34%,var(--bd))}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px var(--glow);background:var(--surf)}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--txm) 80%,transparent)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--txm) 50%),linear-gradient(135deg,var(--txm) 50%,transparent 50%);background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}

/* ---- SURFACES : glass data planes ----------------------- */
.panel,.card,.chartcard,.statrow,.grid,.coachlist,.pro-toolbar,.pro-kpi,.pro-chart-card,.confluence-panel,.pc-panel,.pc-section,.pc-kpi,.pc-table-card,.pc-empty,.empty,.statrow2,.cmpgrid,.journey,.tcard,.calcbox,.smcscore{
  position:relative;background:var(--surf);border:1px solid var(--bd);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);
  backdrop-filter:blur(16px) saturate(135%);
}
.card,.chartcard,.panel{overflow:hidden}
.chartcard{padding:18px 16px 14px;margin-top:16px}
.chartcard canvas{max-height:245px}
.panel{padding:18px}
.card{padding:0}
.empty{text-align:center;padding:56px 22px;border-style:dashed;border-color:color-mix(in srgb,var(--acc) 26%,var(--bd));background:color-mix(in srgb,var(--surf) 62%,transparent)}
.empty .idx{font-family:var(--fm);color:var(--acc);font-size:11px;letter-spacing:2px;margin-bottom:8px}
.empty .lbl{font:600 9.5px/1 var(--fm);letter-spacing:2.4px;color:var(--txm);text-transform:uppercase;margin-bottom:14px}
.empty h3{font-family:var(--fh);color:var(--tx);font-size:21px;font-weight:600;margin-bottom:6px}
.empty p{color:var(--txm);font-size:12.5px;max-width:340px;margin:0 auto;line-height:1.6}
.empty .btns{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}

/* Stat planes */
.statrow{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);overflow:hidden;margin-top:16px;padding:0}
@media(min-width:640px){.statrow{grid-template-columns:repeat(4,1fr)}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);overflow:hidden;padding:0}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.stat{background:color-mix(in srgb,var(--surf) 94%,transparent);padding:16px 15px;min-height:78px;transition:background .25s var(--ease),transform .25s var(--ease);position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:var(--sweep,0%);background:linear-gradient(90deg,transparent,var(--acc));opacity:.5;transition:width .8s var(--ease)}
.stat:hover{background:color-mix(in srgb,var(--acc) 6%,var(--surf));transform:translateY(-2px)}
.stat-label{font:700 8.5px/1 var(--fm);color:var(--txm);text-transform:uppercase;letter-spacing:1.4px}
.stat-val{font-family:var(--fd);font-size:20px;font-weight:600;margin-top:8px;letter-spacing:-.4px}
.up{color:var(--ok)}.down{color:var(--bad)}

/* ---- HERO : the now-signal ------------------------------ */
.hero{position:relative;padding:26px 4px 8px}
.hero::before{content:'◈ ACCOUNT INTELLIGENCE / LIVE';position:absolute;left:4px;top:2px;font:600 8px/1 var(--fm);letter-spacing:2.6px;color:var(--acc);opacity:.85}
.hero::after{content:'';position:absolute;right:2%;top:-10px;width:230px;height:150px;background:radial-gradient(circle,var(--glow),transparent 68%);pointer-events:none}
.hero .greet{font-size:12.5px;color:var(--txm);margin-bottom:12px;letter-spacing:.2px}
.hero .greet b{color:var(--tx);font-weight:600}
.heroval{font-family:var(--fd);font-weight:700;font-size:clamp(40px,10vw,66px);letter-spacing:-2.4px;line-height:1;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;position:relative}
.heroval .delta{font-family:var(--fm);font-size:11px;font-weight:700;padding:7px 12px;border-radius:22px;border:1px solid var(--bd);background:color-mix(in srgb,var(--surf) 76%,transparent);backdrop-filter:blur(8px);letter-spacing:.3px}
.delta.up{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--bd))}
.delta.down{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--bd))}
.herolabel{font:700 9px/1 var(--fm);letter-spacing:2.4px;color:var(--txm);text-transform:uppercase;margin-top:12px}

/* ---- DATA-PLANE (chart) chrome -------------------------- */
.chartcard::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(118deg,color-mix(in srgb,var(--acc) 5%,transparent),transparent 40%)}
.chartcard::after{content:'';position:absolute;left:14px;right:14px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--edge),transparent);opacity:.6}

/* ---- TABLES / ROWS -------------------------------------- */
.statrow2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;border-radius:0;box-shadow:none;background:color-mix(in srgb,var(--surf) 92%,transparent);border:0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sr-label{font-family:var(--fd);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.sr-flag{font:600 8px/1 var(--fm);letter-spacing:1px;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);padding:3px 6px;border-radius:20px}
.sr-metrics{display:flex;gap:16px;font:500 10.5px/1 var(--fm);flex-wrap:wrap;justify-content:flex-end}
.cmpgrid{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line);overflow:hidden;padding:0}
.cmpcard{padding:18px;background:color-mix(in srgb,var(--surf) 94%,transparent)}
.cmptitle{font:700 9px/1 var(--fm);letter-spacing:1.6px;color:var(--acc);text-transform:uppercase;margin-bottom:12px}
.cmprow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.cmprow span:first-child{color:var(--txm);font:600 10px/1 var(--fm);letter-spacing:1px;text-transform:uppercase}

/* ---- JOURNAL -------------------------------------------- */
.searchrow{display:flex;gap:9px;margin:16px 0 10px;max-width:700px}
.jrow{display:flex;align-items:center;gap:12px;padding:15px 8px;border-bottom:1px solid var(--line);cursor:pointer;transition:.22s var(--ease);position:relative}
.jrow::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:2px;background:var(--acc);opacity:0;transition:.22s var(--ease);border-radius:2px}
.jrow:hover{padding-left:14px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 8%,transparent),transparent)}
.jrow:hover::before{opacity:1}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot.buy{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 12%,transparent)}
.dot.sell{background:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 12%,transparent)}
.tinfo{flex:1;min-width:0}
.tsym{font-weight:700;font-size:13px;font-family:var(--fd);letter-spacing:.5px}
.tmeta{font:500 10px/1.5 var(--fm);color:var(--txm);margin-top:3px}
.tright{text-align:right}
.tpnl{font-weight:700;font-size:13.5px;font-family:var(--fd)}
.tr{font:500 10px/1 var(--fm);color:var(--txm);margin-top:3px}

/* ---- FORM ----------------------------------------------- */
.formgrid{display:grid;grid-template-columns:1fr;gap:13px}
@media(min-width:640px){.formgrid{grid-template-columns:1fr 1fr}}
.fld label{display:block;font:700 8.5px/1 var(--fm);color:var(--txm);margin-bottom:7px;text-transform:uppercase;letter-spacing:1.3px}
.dirtoggle{display:flex;gap:8px}
.dirtoggle button{flex:1;min-height:44px;border-radius:11px;border:1px solid var(--bd);background:color-mix(in srgb,var(--surf2) 60%,transparent);color:var(--txm);font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:1.4px;cursor:pointer;transition:.2s var(--ease)}
.dirtoggle button.on.buy{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 8%,transparent)}
.dirtoggle button.on.sell{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 8%,transparent)}
.calcbox{padding:14px 16px;font-size:11.5px;color:var(--txm);margin-top:8px;display:flex;gap:22px;flex-wrap:wrap;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 8%,var(--surf2)),var(--surf2))}
.calcbox .cv{display:block;font-family:var(--fd);color:var(--tx);font-size:16px;font-weight:700;margin-top:3px}
.smcgroup{margin-top:16px}
.smcgroup .glabel{font:700 9px/1 var(--fm);letter-spacing:1.6px;color:var(--acc);text-transform:uppercase;margin-bottom:8px}
.smcrow{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.smcrow input{width:auto;min-height:auto;accent-color:var(--acc)}
.smcrow label{font-size:12.5px;flex:1;cursor:pointer}
.smcrow .w{font:600 10px/1 var(--fm);color:var(--txm)}
.smcscore{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;margin-top:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 12%,var(--surf2)),var(--surf2))}
.smcscore .sv{font-family:var(--fd);font-size:26px;font-weight:700}
.smcscore .sl{font:700 9px/1 var(--fm);letter-spacing:1.6px;color:var(--txm);text-transform:uppercase}
.smcscore .sc{font:700 10.5px/1 var(--fd);letter-spacing:1.2px;text-transform:uppercase;color:var(--acc)}
.flagrow{display:flex;gap:10px 16px;margin-top:12px;flex-wrap:wrap}
.flagrow label{display:flex;align-items:center;gap:7px;text-transform:none;font-weight:500;font-size:12px;color:var(--txm);cursor:pointer}
.flagrow input{width:auto;min-height:auto;accent-color:var(--acc)}
.plan-confluence-help{font-size:10px;color:var(--txm);line-height:1.5;margin-top:6px}
.plan-confluence-help code{color:var(--acc);font-family:var(--fm);font-size:9px}

/* ---- GUARDIAN + CONFLUENCE ------------------------------ */
.guardbadge{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:11px;font:700 10.5px/1 var(--fm);letter-spacing:.8px;text-transform:uppercase;border:1px solid var(--bd)}
.guardbadge.aligned{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 42%,var(--bd));background:color-mix(in srgb,var(--ok) 8%,transparent)}
.guardbadge.warning{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 42%,var(--bd));background:color-mix(in srgb,var(--warn) 8%,transparent)}
.guardbadge.breach{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 42%,var(--bd));background:color-mix(in srgb,var(--bad) 8%,transparent)}
.guardreasons{margin-top:8px;font-size:11.5px;color:var(--txm);line-height:1.65}
.confluence-panel{border:1px solid var(--edge);border-radius:16px;padding:16px;background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 8%,var(--surf)),var(--surf));margin-top:14px;box-shadow:var(--shadow-soft)}
.confluence-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px;flex-wrap:wrap}
.confluence-head h3{font-family:var(--fd);font-size:13.5px;letter-spacing:.3px}
.confluence-head small{color:var(--txm);font-size:10px}
.confluence-global{display:flex;align-items:center;gap:14px;padding:13px;border:1px solid var(--bd);border-radius:13px;background:color-mix(in srgb,var(--surf2) 62%,transparent);margin-bottom:12px}
.confluence-score{font-family:var(--fd);font-size:30px;font-weight:700;letter-spacing:-1.2px}
.confluence-quality{font:700 10px/1 var(--fd);color:var(--acc);text-transform:uppercase;letter-spacing:1.2px}
.confluence-calc{font:500 10px/1.5 var(--fm);color:var(--txm);margin-top:4px}
.confluence-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.conf-item{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:start;padding:11px;border:1px solid var(--bd);border-radius:12px;background:color-mix(in srgb,var(--surf) 74%,transparent)}
.conf-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;background:var(--txm);box-shadow:0 0 0 4px color-mix(in srgb,var(--txm) 10%,transparent)}
.conf-item.valid .conf-dot{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 14%,transparent)}
.conf-item.invalid .conf-dot{background:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 14%,transparent)}
.conf-name{font-size:11px;font-weight:700}
.conf-proof{font-size:10px;color:var(--txm);line-height:1.45;margin-top:3px}
.conf-meta{text-align:right;white-space:nowrap}
.conf-status{font:700 8px/1 var(--fm);letter-spacing:.8px;text-transform:uppercase}
.conf-status.valid{color:var(--ok)}.conf-status.invalid{color:var(--bad)}.conf-status.neutral{color:var(--txm)}
.conf-points{font-family:var(--fd);font-size:12px;margin-top:4px}
.conf-weight{font:500 8px/1 var(--fm);color:var(--txm);margin-top:3px}

/* ---- DISCIPLINE / COACH / TRADER CARD ------------------- */
.discipline{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.ringwrap{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--pct)*1%),color-mix(in srgb,var(--line) 70%,transparent) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;filter:drop-shadow(0 0 22px var(--glow))}
.ringwrap::after{content:'';position:absolute;inset:8px;border-radius:50%;border:1px solid color-mix(in srgb,var(--acc) 18%,transparent)}
.ringwrap .inner{width:76px;height:76px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .inner b{font-family:var(--fd);font-size:23px;font-weight:700}
.ringwrap .inner span{font:700 8px/1 var(--fm);color:var(--txm);letter-spacing:1.2px;text-transform:uppercase;margin-top:3px}
.breakdown{flex:1;min-width:180px;display:flex;flex-direction:column;gap:10px}
.brow{display:flex;align-items:center;gap:10px;font:500 10px/1 var(--fm)}
.brow .lbl{width:112px;color:var(--txm);text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
.brow .bar{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.brow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:3px;transition:width .9s var(--ease)}
.brow .v{width:26px;text-align:right;font-family:var(--fd);color:var(--tx)}
.coachlist{display:flex;flex-direction:column;gap:1px;background:var(--line);overflow:hidden;padding:0}
.coachitem{background:color-mix(in srgb,var(--surf) 94%,transparent);padding:14px 16px}
.coachitem .tag{font:700 8.5px/1 var(--fm);letter-spacing:1.6px;text-transform:uppercase;color:var(--acc)}
.coachitem .tag.warn{color:var(--warn)}.coachitem .tag.bad{color:var(--bad)}.coachitem .tag.ok{color:var(--ok)}
.coachitem p{font-size:12.5px;margin-top:6px;line-height:1.55}
.tcard{background:linear-gradient(150deg,color-mix(in srgb,var(--surf) 90%,var(--acc)),var(--surf2));border-radius:var(--radius-xl);padding:26px;position:relative;overflow:hidden;box-shadow:var(--shadow-deep)}
.tcard::before{content:'';position:absolute;top:-45%;right:-22%;width:260px;height:260px;background:radial-gradient(circle,var(--glow2),transparent 70%)}
.tcard .demotag{position:absolute;top:18px;right:18px;font:700 8px/1 var(--fm);letter-spacing:2px;color:var(--acc);border:1px solid var(--edge);padding:4px 9px;border-radius:20px}
.tcmono{width:36px;height:36px;border:1px solid var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;color:var(--acc);margin-bottom:14px}
.tcard h4{font-family:var(--fd);font-size:19px;font-weight:700;letter-spacing:1px}
.tcrole{font:500 10.5px/1.4 var(--fm);color:var(--txm);margin:4px 0 18px}
.tcgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;position:relative}
.tcgrid div span{display:block;font:700 8.5px/1.3 var(--fm);color:var(--txm);text-transform:uppercase;letter-spacing:.9px}
.tcgrid div b{font-family:var(--fd);font-size:16px;font-weight:700;margin-top:4px;display:block}

/* ---- HEATMAP / MATRIX / JOURNEY ------------------------- */
.heatwrap{overflow-x:auto;padding-bottom:14px}
.heatgrid{display:grid;grid-template-columns:34px repeat(24,1fr);gap:3px;min-width:620px}
.hcell{aspect-ratio:1;border-radius:4px;transition:transform .15s,filter .15s}
.hcell:hover{transform:scale(1.18);filter:brightness(1.15)}
.hlabel{display:flex;align-items:center;color:var(--txm);font:600 9px/1 var(--fm)}
.matrixwrap{overflow-x:auto;border-radius:12px}
.matrixtable{border-collapse:separate;border-spacing:3px}
.matrixtable th{font:600 8.5px/1 var(--fm);color:var(--txm);border-radius:5px}
.mcell{min-width:56px;height:46px;border-radius:8px;text-align:center;cursor:pointer;padding:2px;vertical-align:middle;transition:transform .15s,filter .15s}
.mcell:hover{transform:translateY(-2px);filter:brightness(1.1)}
.mcell.empty{color:var(--txm);cursor:default}
.mcell b{font-family:var(--fd);font-size:11px;display:block}
.mcell span{font:500 8px/1 var(--fm);color:var(--txm)}
.journey{display:flex;flex-direction:column;gap:1px;background:var(--line);overflow:hidden;padding:0}
.mstone{display:flex;gap:14px;position:relative;padding:14px 16px;background:color-mix(in srgb,var(--surf) 94%,transparent)}
.mstone::before{content:'';position:absolute;left:25px;top:38px;bottom:-1px;width:1px;background:var(--line)}
.mstone:last-child::before{display:none}
.mdot{width:21px;height:21px;border-radius:50%;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-shrink:0;font:600 9px/1 var(--fm);background:var(--surf);color:var(--txm)}
.mstone.unlocked .mdot{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--surf));box-shadow:0 0 0 5px var(--glow)}
.mtitle{font-family:var(--fd);font-size:12.5px;font-weight:600}
.mstone:not(.unlocked) .mtitle{color:var(--txm)}
.mstat{font:500 10px/1.5 var(--fm);color:var(--txm);margin-top:3px}

/* ---- MODAL / TOAST -------------------------------------- */
.modal-overlay{position:fixed;inset:0;background:rgba(3,4,8,.7);backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center;z-index:100}
@media(min-width:640px){.modal-overlay{align-items:center}}
.modal-overlay.hidden{display:none}
.modal{background:color-mix(in srgb,var(--surf) 96%,transparent);backdrop-filter:blur(20px);border:1px solid var(--edge);border-radius:24px 24px 0 0;padding:24px;max-width:460px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:var(--shadow-deep);animation:tm-modal .35s var(--ease)}
@media(min-width:640px){.modal{border-radius:20px}}
@keyframes tm-modal{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:none}}
.modal h3{font-family:var(--fd);font-size:17px;margin-bottom:14px;letter-spacing:.3px}
.detrow{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.detrow span:first-child{color:var(--txm);text-transform:uppercase;font:700 9.5px/1.4 var(--fm);letter-spacing:.8px}
.modalbtns{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(12px);background:color-mix(in srgb,var(--tx) 94%,transparent);color:var(--bg);padding:12px 20px;border-radius:12px;font:700 12px/1 var(--fd);z-index:500;opacity:0;transition:.32s var(--ease);border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);box-shadow:var(--shadow-deep);pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.hidden{display:none}

/* ---- NAVIGATION : orbital rail (desktop) + idx dock (mobile) */
.bottomnav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;gap:4px;padding:5px;border-radius:20px;
  background:color-mix(in srgb,var(--surf) 88%,transparent);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--bd);box-shadow:0 18px 44px rgba(0,0,0,.34)}
.bottomnav button{flex:1;background:none;border:none;color:var(--txm);font:700 7.5px/1 var(--fm);letter-spacing:.6px;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;padding:9px 2px;border-radius:15px;transition:.22s var(--ease);min-height:52px}
.bottomnav button svg{width:17px;height:17px}
.bottomnav button.active{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 22%,transparent),0 6px 18px var(--glow)}
.bottomnav button.active svg{filter:drop-shadow(0 0 7px var(--glow))}

@media(min-width:900px){
  .sidebar{display:flex;flex-direction:column;width:264px;flex-shrink:0;padding:26px 18px;position:sticky;top:0;height:100vh;
    background:color-mix(in srgb,var(--surf) 88%,transparent);backdrop-filter:blur(20px);border-right:1px solid color-mix(in srgb,var(--acc) 14%,var(--bd))}
  .sidebar .brand{margin-bottom:30px}
  .sidebar nav{display:flex;flex-direction:column;gap:4px}
  .sidebar .navlink{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:var(--txm);text-decoration:none;font:600 12.5px/1 var(--fb);cursor:pointer;transition:.22s var(--ease);border:1px solid transparent;position:relative;min-height:44px}
  .sidebar .navlink svg{width:16px;height:16px}
  .sidebar .navlink.active{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 14%,transparent),transparent);color:var(--tx);border-color:color-mix(in srgb,var(--acc) 20%,var(--bd));box-shadow:inset 3px 0 var(--acc)}
  .sidebar .navlink.active svg{stroke:var(--acc);filter:drop-shadow(0 0 6px var(--glow))}
  .sidebar .navlink:hover{color:var(--tx)}
  .sidebar .navlink.active::after{content:'';position:absolute;right:12px;width:5px;height:5px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--glow)}
  .sidebar .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:18px;border-top:1px solid var(--line)}
  .sidebar .foot .status{display:flex}
  .bottomnav{display:none}
  .topbar{display:none}
  .content{padding:38px 44px 70px;max-width:1300px}
  .hero{padding-top:30px}
  #view-newtrade form{max-width:960px}
}
@media(min-width:1200px){.sidebar{width:280px}.content{padding-left:58px;padding-right:58px}}

/* ---- MOBILE-FIRST TUNING (deliberate, not squeezed) ----- */
@media(max-width:899px){
  .content{padding:10px 14px calc(122px + env(safe-area-inset-bottom,0px))}
  .topbar{margin:calc(11px + env(safe-area-inset-top,0px)) 12px 2px;padding:8px 10px}
  .topbar .brandtxt{font-size:10px}.topbar .brandtxt small{font-size:6.4px}
  .hero::after{right:-24px;top:-4px;width:160px;height:110px}
  .stat{padding:14px 12px;min-height:74px}.stat-val{font-size:18px}
  .chartcard{padding:15px 12px 11px}
  .searchrow{display:grid;grid-template-columns:minmax(0,1fr) 108px}
  .searchrow select{max-width:none!important}
  .confluence-list{grid-template-columns:1fr}
  .sr-metrics{width:100%;justify-content:flex-start;gap:8px 14px}
  .modal{border-radius:24px 24px 0 0}
}
@media(max-width:420px){
  .heroval{font-size:38px}
  .statrow{grid-template-columns:repeat(2,1fr)}
  .tcgrid{grid-template-columns:repeat(2,1fr)}
}

/* ---- V2 lens : filterable analytics --------------------- */
.pro-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px;margin:18px 0;border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 7%,var(--surf)),var(--surf))}
.pro-toolbar select,.pro-toolbar input{width:auto;min-width:112px;min-height:36px;padding:8px 11px;font:700 10px/1 var(--fb)}
.pro-toolbar .filter-label{font:700 8px/1 var(--fm);text-transform:uppercase;letter-spacing:1.3px;color:var(--acc)}
.pro-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:15px 0}
.pro-kpi{padding:14px;border-radius:13px;min-width:0}
.pro-kpi small{display:block;color:var(--txm);font:700 8px/1 var(--fm);letter-spacing:1.15px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pro-kpi strong{display:block;font-family:var(--fd);font-size:20px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.5px}
.pro-chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.pro-chart-card{border-radius:16px;padding:16px;min-width:0}
.pro-chart-card.wide{grid-column:1/-1}
.pro-chart-card h3{font-family:var(--fd);font-size:11px;letter-spacing:.9px;text-transform:uppercase;margin-bottom:10px;color:var(--acc)}
.pro-chart-card canvas{width:100%!important;max-height:240px}
.pro-empty{padding:18px;border:1px dashed var(--edge);border-radius:12px;color:var(--txm);font-size:11px}

/* ---- V3 Performance Center ------------------------------ */
#performanceCenter{margin:24px 0 30px}
.pc-toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border:1px solid var(--edge);background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 7%,var(--surf)),var(--surf));border-radius:14px;position:sticky;top:8px;z-index:3;backdrop-filter:blur(14px)}
.pc-toolbar select,.pc-toolbar button{min-height:34px;border:1px solid var(--bd);background:var(--surf);color:var(--tx);border-radius:8px;padding:0 11px;font:600 11px/1 var(--fb)}
.pc-toolbar .pc-title{font:700 11px/1 var(--fd);text-transform:uppercase;letter-spacing:.16em;color:var(--acc);display:flex;align-items:center;margin-right:auto}
.pc-kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:14px 0}
.pc-kpi{min-height:78px;padding:12px;border-radius:11px}
.pc-kpi span,.pc-kpi small{display:block;color:var(--txm);font:700 9px/1.4 var(--fm);text-transform:uppercase;letter-spacing:.08em}
.pc-kpi strong{display:block;font-family:var(--fd);font-size:18px;margin:8px 0 4px}
